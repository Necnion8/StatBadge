import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id "com.gradleup.shadow" version "8.3.0"
}

group = 'com.gmail.necnionch.myplugin.statbadge'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }

    // LandsAPI
    maven { url = 'https://jitpack.io' }

    // MythicMobs
    maven { url = 'https://mvn.lumine.io/repository/maven-public/' }

    // AFKPlus
    maven { url = "https://maven.lapismc.net/repository/maven/" }
}

dependencies {
    compileOnly "org.jetbrains:annotations:24.0.0"
    compileOnly "org.spigotmc:spigot-api:1.13.2-R0.1-SNAPSHOT"
    implementation "com.zaxxer:HikariCP:4.0.3" exclude group: "org.slf4j"

    compileOnly "com.github.angeschossen:LandsAPI:7.10.13"
    compileOnly 'io.lumine:Mythic-Dist:5.6.1'
    compileOnly "net.lapismc:AFKPlus:3.4.5"
}

tasks.named("shadowJar", ShadowJar) {
    archiveClassifier.set("")
    dependencies {
        exclude "/META-INF/**"
    }
    relocate "com.zaxxer.hikari", "${project.group}.libs.hikari"
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
