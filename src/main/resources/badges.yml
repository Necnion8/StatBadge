skeleton_kills:  # 称号ID
  # 称号名 (カラーコード可)
  name: "&bスケルトンの討伐"
  # 称号タグ (カラーコード可、null で称号名)
  title: null
  # 説明文 (カラーコード、複数行可)
  description: "スケルトンを討伐した証"

  # GUIで表示される称号アイコンの見た目を設定します
  icon:
    # アイテムID
    type: iron_sword
    # カスタムテクスチャ用の値を設定できます (1.14以降のみ)
    custom-model-data: 123
  # ※ アイテムIDのみ指定する場合のみ、以下のように指定することもできます
  ## icon: apple

  # 称号の獲得に必要な目標を設定します
  stats:
    # 統計タイプ (他プラグインによって拡張対応します)
    type: action  # action の場合は省略可
    # actionタイプの統計には以下の設定が必要です
    action: entity_killed  # アクションのタイプ (他プラグインによって拡張対応します)
    # 統計の目標値。この値を超えると称号が与えられます
    value: 10
    # アクション entity_killed には以下の設定が必要です
    # ※ アクションによって必要な設定項目が異なるため、StatBadgeプラグインの説明ページを参照して設定してください。
    entity: skeleton
